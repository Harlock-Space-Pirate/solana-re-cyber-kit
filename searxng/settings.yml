# Local SearXNG for DeepSeek Harness / Qwen Cyber.
# Copy to ~/.dsh/searxng/settings.yml (install.sh does this).
# JSON API is ON (disabled in upstream defaults).

use_default_settings: true

general:
  debug: false
  instance_name: "searxng-local"
  donate_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "CHANGE_ME"
  bind_address: "127.0.0.1"
  port: 8888
  limiter: false
  image_proxy: false
  method: "GET"
  default_http_headers:
    X-Content-Type-Options: nosniff

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0

# No Redis/Valkey — limiter is off.
valkey:
  url: false

ui:
  static_use_hash: false
